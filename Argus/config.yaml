input:
  directory: input

output:
  artifacts_directory: output/artifacts

sampling:
  samples_per_second: 10

analysis:
  lookback_sample_offset: 4

stable_candidate:
  adjacent_difference_maximum: 0.06
  long_lookback_difference_maximum: 0.01

manual_frame_picker:
  initial_step_seconds: 0.3
  minimum_step_seconds: 0.1
  step_adjustment_seconds: 0.1
  page_jump_seconds: 2.0
  output_directory: output/pages

page_change:
  changed_area_ratio_threshold: 0.10
  ssim_threshold: 0.50
  ecc_score_minimum: 0.90
  alignment_translation_maximum_pixels: 2.0
  event_merge_gap_seconds: 0.3
  output_directory: output/page_export

report:
  json_filename: video_report.json
  markdown_filename: video_report.md
