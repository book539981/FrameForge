input:
  directory: input

output:
  artifacts_directory: output/artifacts
  debug_directory: output/debug
  temp_directory: output/temp
  pages_directory: output/pages

sampling:
  frame_interval: 1

stable_frame:
  ssim_minimum: 0.85
  adjacent_difference_maximum: 0.050
  lookback_seconds: 0.20
  lookback_difference_maximum: 0.070
  anchor_difference_maximum: 0.065
  motion_difference_threshold: 0.040
  motion_minimum_duration_seconds: 0.35
  minimum_stable_duration_seconds: 0.50
  fail_tolerance_seconds: 0.50
  best_frame_exclusion_seconds: 0.60
  decision_metrics:
    - adjacent_difference_score
    - lookback_difference_score
    - anchor_difference_score
  diagnostic_metrics:
    - ssim

report:
  stable_segments_filename: stable_segments.json
